naftiko: 1.0.0-alpha2
info:
  label: Logto API references — Dashboard
  description: 'Logto API references — Dashboard. 3 operations. Lead operation: Get active user data. Self-contained Naftiko
    capability covering one Logto business surface.'
  tags:
  - Logto
  - Dashboard
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOGTO_API_KEY: LOGTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: logto-dashboard
    baseUri: https://[tenant_id].logto.app
    description: Logto API references — Dashboard business capability. Self-contained, no shared references.
    resources:
    - name: api-dashboard-users-active
      path: /api/dashboard/users/active
      operations:
      - name: getactiveusercounts
        method: GET
        description: Get active user data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: date
          in: query
          type: string
          description: The date to get active user data.
    - name: api-dashboard-users-new
      path: /api/dashboard/users/new
      operations:
      - name: getnewusercounts
        method: GET
        description: Get new user count
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-dashboard-users-total
      path: /api/dashboard/users/total
      operations:
      - name: gettotalusercount
        method: GET
        description: Get total user count
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LOGTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: logto-dashboard-rest
    port: 8080
    description: REST adapter for Logto API references — Dashboard. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/dashboard/users/active
      name: api-dashboard-users-active
      description: REST surface for api-dashboard-users-active.
      operations:
      - method: GET
        name: getactiveusercounts
        description: Get active user data
        call: logto-dashboard.getactiveusercounts
        with:
          date: rest.date
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/dashboard/users/new
      name: api-dashboard-users-new
      description: REST surface for api-dashboard-users-new.
      operations:
      - method: GET
        name: getnewusercounts
        description: Get new user count
        call: logto-dashboard.getnewusercounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/dashboard/users/total
      name: api-dashboard-users-total
      description: REST surface for api-dashboard-users-total.
      operations:
      - method: GET
        name: gettotalusercount
        description: Get total user count
        call: logto-dashboard.gettotalusercount
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: logto-dashboard-mcp
    port: 9090
    transport: http
    description: MCP adapter for Logto API references — Dashboard. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-active-user-data
      description: Get active user data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: logto-dashboard.getactiveusercounts
      with:
        date: tools.date
      outputParameters:
      - type: object
        mapping: $.
    - name: get-new-user-count
      description: Get new user count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: logto-dashboard.getnewusercounts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-total-user-count
      description: Get total user count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: logto-dashboard.gettotalusercount
      outputParameters:
      - type: object
        mapping: $.
