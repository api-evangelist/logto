naftiko: 1.0.0-alpha2
info:
  label: Logto API references — Swagger.json
  description: 'Logto API references — Swagger.json. 1 operations. Lead operation: Get Swagger JSON. Self-contained Naftiko
    capability covering one Logto business surface.'
  tags:
  - Logto
  - Swagger.json
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOGTO_API_KEY: LOGTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: logto-swagger-json
    baseUri: https://[tenant_id].logto.app
    description: Logto API references — Swagger.json business capability. Self-contained, no shared references.
    resources:
    - name: api-swagger.json
      path: /api/swagger.json
      operations:
      - name: getswaggerjson
        method: GET
        description: Get Swagger JSON
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LOGTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: logto-swagger-json-rest
    port: 8080
    description: REST adapter for Logto API references — Swagger.json. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/swagger-json
      name: api-swagger-json
      description: REST surface for api-swagger.json.
      operations:
      - method: GET
        name: getswaggerjson
        description: Get Swagger JSON
        call: logto-swagger-json.getswaggerjson
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: logto-swagger-json-mcp
    port: 9090
    transport: http
    description: MCP adapter for Logto API references — Swagger.json. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-swagger-json
      description: Get Swagger JSON
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: logto-swagger-json.getswaggerjson
      outputParameters:
      - type: object
        mapping: $.
