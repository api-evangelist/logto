      call: logto-hooks.updatehook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-hook
      description: Delete hook
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: logto-hooks.deletehook
      outputParameters:
      - type: object
        mapping: $.
    - name: get-recent-logs-hook
      description: Get recent logs for a hook
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: logto-hooks.listhookrecentlogs
      with:
        logKey: tools.logKey
        page: tools.page
        page_size: tools.page_size
      outputParameters:
      - type: object
        mapping: $.
    - name: update-signing-key-hook
      description: Update signing key for a hook
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: logto-hooks.updatehooksigningkey
      outputParameters:
      - type: object
        mapping: $.
