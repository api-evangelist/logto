naftiko: 1.0.0-alpha2
info:
  label: Logto API references — Status
  description: 'Logto API references — Status. 1 operations. Lead operation: Health check. Self-contained Naftiko capability
    covering one Logto business surface.'
  tags:
  - Logto
  - Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOGTO_API_KEY: LOGTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: logto-status
    baseUri: https://[tenant_id].logto.app
    description: Logto API references — Status business capability. Self-contained, no shared references.
    resources:
    - name: api-status
      path: /api/status
      operations:
      - name: getstatus
        method: GET
        description: Health check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LOGTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: logto-status-rest
    port: 8080
    description: REST adapter for Logto API references — Status. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/status
      name: api-status
      description: REST surface for api-status.
      operations:
      - method: GET
        name: getstatus
        description: Health check
        call: logto-status.getstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: logto-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for Logto API references — Status. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: health-check
      description: Health check
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: logto-status.getstatus
      outputParameters:
      - type: object
        mapping: $.
