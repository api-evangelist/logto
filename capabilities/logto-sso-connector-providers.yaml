naftiko: 1.0.0-alpha2
info:
  label: Logto API references — SSO connector providers
  description: 'Logto API references — SSO connector providers. 1 operations. Lead operation: List all the supported SSO connector
    provider details. Self-contained Naftiko capability covering one Logto business surface.'
  tags:
  - Logto
  - SSO connector providers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOGTO_API_KEY: LOGTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: logto-sso-connector-providers
    baseUri: https://[tenant_id].logto.app
    description: Logto API references — SSO connector providers business capability. Self-contained, no shared references.
    resources:
    - name: api-sso-connector-providers
      path: /api/sso-connector-providers
      operations:
      - name: listssoconnectorproviders
        method: GET
        description: List all the supported SSO connector provider details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LOGTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: logto-sso-connector-providers-rest
    port: 8080
    description: REST adapter for Logto API references — SSO connector providers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/api/sso-connector-providers
      name: api-sso-connector-providers
      description: REST surface for api-sso-connector-providers.
      operations:
      - method: GET
        name: listssoconnectorproviders
        description: List all the supported SSO connector provider details
        call: logto-sso-connector-providers.listssoconnectorproviders
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: logto-sso-connector-providers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Logto API references — SSO connector providers. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-all-supported-sso-connector
      description: List all the supported SSO connector provider details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: logto-sso-connector-providers.listssoconnectorproviders
      outputParameters:
      - type: object
        mapping: $.
