naftiko: 1.0.0-alpha2
info:
  label: Logto API references — Secrets
  description: 'Logto API references — Secrets. 1 operations. Lead operation: Delete secret. Self-contained Naftiko capability
    covering one Logto business surface.'
  tags:
  - Logto
  - Secrets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LOGTO_API_KEY: LOGTO_API_KEY
capability:
  consumes:
  - type: http
    namespace: logto-secrets
    baseUri: https://[tenant_id].logto.app
    description: Logto API references — Secrets business capability. Self-contained, no shared references.
    resources:
    - name: api-secrets-id
      path: /api/secrets/{id}
      operations:
      - name: deletesecret
        method: DELETE
        description: Delete secret
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LOGTO_API_KEY}}'
  exposes:
  - type: rest
    namespace: logto-secrets-rest
    port: 8080
    description: REST adapter for Logto API references — Secrets. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/secrets/{id}
      name: api-secrets-id
      description: REST surface for api-secrets-id.
      operations:
      - method: DELETE
        name: deletesecret
        description: Delete secret
        call: logto-secrets.deletesecret
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: logto-secrets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Logto API references — Secrets. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: delete-secret
      description: Delete secret
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: logto-secrets.deletesecret
      outputParameters:
      - type: object
        mapping: $.
