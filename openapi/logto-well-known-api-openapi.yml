                  customProfileFields:
                    type: array
                    items:
                      type: object
                      required:
                      - tenantId
                      - id
                      - name
                      - type
                      - label
                      - description
                      - required
                      - config
                      - createdAt
                      - sieOrder
                      properties:
                        tenantId:
                          type: string
                          maxLength: 21
                        id:
                          type: string
                          minLength: 1
                          maxLength: 21
                        name:
                          type: string
                          minLength: 1
                          maxLength: 128
                        type:
                          type: string
                          enum:
                          - Text
                          - Number
                          - Date
                          - Checkbox
                          - Select
                          - Url
                          - Regex
                          - Address
                          - Fullname
                        label:
                          type: string
                          maxLength: 128
                        description:
                          type: string
                          maxLength: 256
                          nullable: true
                        required:
                          type: boolean
                        config:
                          type: object
                          properties:
                            placeholder:
                              type: string
                              maxLength: 256
                            minLength:
                              type: number
                            maxLength:
                              type: number
                            minValue:
                              type: number
