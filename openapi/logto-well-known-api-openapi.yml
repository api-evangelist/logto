                                    - Regex
                                    - Address
                                    - Fullname
                                  label:
                                    type: string
                                    minLength: 1
                                  description:
                                    type: string
                                  required:
                                    type: boolean
                                  config:
                                    type: object
                                    properties:
                                      placeholder:
