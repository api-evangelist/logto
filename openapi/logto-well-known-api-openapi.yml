openapi: 3.0.1
info:
  title: Logto API references Account center Well-known API
  description: 'API references for Logto services.


    Note: The documentation is for Logto Cloud. If you are using Logto OSS, please refer to the response of `/api/swagger.json` endpoint on your Logto instance.'
  version: Cloud
servers:
- url: https://[tenant_id].logto.app/
  description: Logto endpoint address.
security:
- OAuth2:
  - all
tags:
- name: Well-known
  description: Well-Known routes provide information and resources that can be discovered by clients without the need for authentication.
paths:
  /api/.well-known/sign-in-exp:
    get:
      operationId: GetSignInExperienceConfig
      tags:
      - Well-known
      parameters:
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
      - name: appId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The full sign-in experience configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                - tenantId
                - id
                - color
                - branding
                - hideLogtoBranding
                - languageInfo
                - termsOfUseUrl
                - privacyPolicyUrl
                - agreeToTermsPolicy
                - signIn
                - signUp
                - socialSignIn
                - socialSignInConnectorTargets
                - signInMode
                - customCss
                - customContent
                - customUiAssets
                - passwordPolicy
                - mfa
                - adaptiveMfa
                - singleSignOnEnabled
                - supportEmail
                - supportWebsiteUrl
                - unknownSessionRedirectUrl
                - captchaPolicy
                - sentinelPolicy
                - emailBlocklistPolicy
                - passkeySignIn
                - signUpProfileFields
                - socialConnectors
                - ssoConnectors
                - forgotPassword
                - isDevelopmentTenant
                - customProfileFields
                properties:
                  tenantId:
                    type: string
                    maxLength: 21
                  id:
                    type: string
                    minLength: 1
                    maxLength: 21
                  color:
                    type: object
                    required:
                    - primaryColor
                    - isDarkModeEnabled
                    - darkPrimaryColor
                    properties:
                      primaryColor:
                        type: string
                        format: regex
                        pattern: /^#[\da-f]{3}([\da-f]{3})?$/i
                      isDarkModeEnabled:
                        type: boolean
                      darkPrimaryColor:
                        type: string
                        format: regex
                        pattern: /^#[\da-f]{3}([\da-f]{3})?$/i
                  branding:
                    type: object
                    properties:
                      logoUrl:
                        type: string
