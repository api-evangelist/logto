                    nullable: true
                  privacyPolicyUrl:
                    type: string
                    maxLength: 2048
                    nullable: true
                  agreeToTermsPolicy:
                    type: string
                    enum:
                    - Automatic
                    - ManualRegistrationOnly
                    - Manual
                  signIn:
                    type: object
                    required:
                    - methods
                    properties:
                      methods:
                        type: array
                        items:
                          type: object
                          required:
                          - identifier
                          - password
                          - verificationCode
                          - isPasswordPrimary
                          properties:
                            identifier:
                              type: string
                              enum:
                              - username
                              - email
                              - phone
                            password:
                              type: boolean
                            verificationCode:
                              type: boolean
                            isPasswordPrimary:
                              type: boolean
                    description: Sign-in method settings.
                  signUp:
                    type: object
                    required:
                    - identifiers
                    - password
                    - verify
                    properties:
                      identifiers:
                        type: array
                        items:
                          type: string
                          enum:
                          - username
                          - email
                          - phone
                        description: Allowed identifiers when signing-up.
                      password:
                        type: boolean
                        description: Whether the user is required to set a password when signing-up.
                      verify:
                        type: boolean
                        description: Whether the user is required to verify their email/phone when signing-up.
                      secondaryIdentifiers:
                        type: array
                        items:
                          type: object
                          required:
                          - identifier
                          properties:
                            identifier:
                              oneOf:
                              - type: string
                                enum:
                                - username
                                - email
                                - phone
                              - type: string
                                enum:
                                - emailOrPhone
                            verify:
                              type: boolean
                        description: Additional identifiers required during sign-up. Once specified, users will be prompted to provide these identifiers when creating an account.
                    description: Sign-up method settings.
                  socialSignIn:
                    type: object
                    properties:
                      automaticAccountLinking:
                        type: boolean
                      skipRequiredIdentifiers:
                        type: boolean
                  socialSignInConnectorTargets:
                    type: array
                    items:
                      type: string
                    description: Enabled social sign-in connectors, will displayed on the sign-in page.
                  signInMode:
                    type: string
                    enum:
                    - SignIn
                    - Register
                    - SignInAndRegister
                  customCss:
                    type: string
                    nullable: true
                  customContent:
                    type: object
                    additionalProperties:
                      type: string
                    description: Custom content to display on experience flow pages. the page pathname will be the config key, the content will be the config value.
                  customUiAssets:
                    type: object
                    required:
                    - id
                    - createdAt
                    properties:
                      id:
                        type: string
                      createdAt:
                        type: number
                    nullable: true
                  passwordPolicy:
                    type: object
                    properties:
                      length:
                        default: {}
                        type: object
                        required:
                        - min
                        - max
                        properties:
                          min:
                            default: 8
                            type: number
                          max:
                            default: 256
                            type: number
                      characterTypes:
                        default: {}
                        type: object
                        required:
                        - min
                        properties:
                          min:
                            default: 1
                            type: number
                      rejects:
                        default: {}
                        type: object
                        required:
                        - pwned
                        - repetitionAndSequence
                        - userInfo
                        - words
                        properties:
                          pwned:
                            default: true
                            type: boolean
                          repetitionAndSequence:
                            default: true
                            type: boolean
                          userInfo:
                            default: true
                            type: boolean
                          words:
                            default: []
                            type: array
                            items:
                              type: string
                    description: Password policies to adjust the password strength requirements.
                  mfa:
                    type: object
                    required:
                    - factors
                    - policy
                    properties:
                      factors:
                        type: array
                        items:
                          type: string
                          enum:
                          - Totp
                          - WebAuthn
                          - BackupCode
                          - EmailVerificationCode
                          - PhoneVerificationCode
                      policy:
                        type: string
                        enum:
                        - UserControlled
                        - Mandatory
                        - PromptOnlyAtSignIn
                        - PromptAtSignInAndSignUp
                        - NoPrompt
                        - PromptAtSignInAndSignUpMandatory
                        - PromptOnlyAtSignInMandatory
                      organizationRequiredMfaPolicy:
                        type: string
                        enum:
                        - NoPrompt
                        - Mandatory
                    description: MFA settings
                  adaptiveMfa:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                    description: Adaptive MFA settings.
                  singleSignOnEnabled:
                    type: boolean
                  supportEmail:
                    type: string
                    nullable: true
                    description: The support email address to display on the error pages.
                  supportWebsiteUrl:
                    type: string
                    nullable: true
                    description: The support website URL to display on the error pages.
                  unknownSessionRedirectUrl:
                    type: string
                    nullable: true
                    description: The fallback URL to redirect users when the sign-in session does not exist or unknown. Client should initiates a new authentication flow after the redirection.
                  captchaPolicy:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                  sentinelPolicy:
                    type: object
                    properties:
                      maxAttempts:
                        type: number
                      lockoutDuration:
                        type: number
                    description: Custom sentinel policy settings. Use this field to customize the user lockout policy. The default value is 100 failed attempts within one hour. The user will be locked out for 60 minutes after exceeding the limit.
                  emailBlocklistPolicy:
                    type: object
                    properties:
                      blockDisposableAddresses:
                        type: boolean
                      blockSubaddressing:
                        type: boolean
                        description: Whether to block sub-addresses. (E.g., example+shopping@test.com)
                      customBlocklist:
                        type: array
                        items:
                          type: string
                        description: Custom blocklist of email addresses or domains.
                      blockDisposableAddress:
                        description: Cloud only.  Whether to block disposable email addresses. Once enabled, Logto will check the email domain against a list of known disposable email domains. If the domain is found in the list, the email address will be blocked.
                    description: Define email restriction policies. Users will be prohibited from registering or linking any email addresses that are included in the blocklist.
                  forgotPasswordMethods:
                    type: array
                    items:
                      type: string
                      enum:
                      - EmailVerificationCode
                      - PhoneVerificationCode
                    nullable: true
                  passkeySignIn:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      showPasskeyButton:
                        type: boolean
                      allowAutofill:
                        type: boolean
                  signUpProfileFields:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                    nullable: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Default sign-in experience settings not found.
      summary: Get default sign-in experience settings
      description: Get the default sign-in experience settings.
