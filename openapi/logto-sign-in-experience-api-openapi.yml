openapi: 3.0.1
info:
  title: Logto API references Account center Sign-in experience API
  description: 'API references for Logto services.


    Note: The documentation is for Logto Cloud. If you are using Logto OSS, please refer to the response of `/api/swagger.json` endpoint on your Logto instance.'
  version: Cloud
servers:
- url: https://[tenant_id].logto.app/
  description: Logto endpoint address.
security:
- OAuth2:
  - all
tags:
- name: Sign-in experience
  description: Endpoints for customizing Logto sign-in experience. See [🎨 Customize sign-in experience](https://docs.logto.io/docs/recipes/customize-sie/) to learn more about how the configuration works and reflects on the user interface.
paths:
  /api/sign-in-exp:
    get:
      operationId: GetSignInExp
      tags:
      - Sign-in experience
      parameters: []
      responses:
        '200':
          description: Default sign-in experience settings.
          content:
            application/json:
              schema:
                type: object
                required:
                - tenantId
                - id
                - color
                - branding
                - hideLogtoBranding
                - languageInfo
                - termsOfUseUrl
                - privacyPolicyUrl
                - agreeToTermsPolicy
                - signIn
                - signUp
                - socialSignIn
                - socialSignInConnectorTargets
                - signInMode
                - customCss
                - customContent
                - customUiAssets
                - passwordPolicy
                - mfa
                - adaptiveMfa
                - singleSignOnEnabled
                - supportEmail
                - supportWebsiteUrl
                - unknownSessionRedirectUrl
                - captchaPolicy
                - sentinelPolicy
                - emailBlocklistPolicy
                - forgotPasswordMethods
                - passkeySignIn
                - signUpProfileFields
                properties:
                  tenantId:
                    type: string
                    maxLength: 21
                  id:
                    type: string
                    minLength: 1
                    maxLength: 21
                  color:
                    type: object
                    required:
                    - primaryColor
                    - isDarkModeEnabled
                    - darkPrimaryColor
                    properties:
                      primaryColor:
                        type: string
                        format: regex
                        pattern: /^#[\da-f]{3}([\da-f]{3})?$/i
                      isDarkModeEnabled:
                        type: boolean
                      darkPrimaryColor:
                        type: string
                        format: regex
                        pattern: /^#[\da-f]{3}([\da-f]{3})?$/i
                    description: The primary branding color for the sign-in page (both light/dark mode).
                  branding:
                    type: object
                    properties:
                      logoUrl:
                        type: string
                        format: url
                      darkLogoUrl:
                        type: string
                        format: url
                      favicon:
                        type: string
                        format: url
                      darkFavicon:
                        type: string
                        format: url
                  hideLogtoBranding:
                    type: boolean
                    description: Cloud only. Whether to hide the Logto branding on hosted sign-in pages.
                  languageInfo:
                    type: object
                    required:
                    - autoDetect
                    - fallbackLanguage
                    properties:
                      autoDetect:
                        type: boolean
                      fallbackLanguage:
                        type: string
                        enum:
                        - af-ZA
                        - am-ET
                        - ar
                        - ar-AR
                        - as-IN
