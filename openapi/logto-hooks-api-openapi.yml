  /api/hooks/{id}/recent-logs:
    get:
      operationId: ListHookRecentLogs
      tags:
      - Hooks
      parameters:
      - $ref: '#/components/parameters/hookId-root'
      - name: logKey
        in: query
        required: false
        schema:
          type: string
        description: The log key to filter logs.
      - name: page
        in: query
        description: Page number (starts from 1).
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        description: Entries per page.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
      responses:
        '200':
          description: A list of recent logs for the hook.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - key
                  - payload
                  - createdAt
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 21
                    key:
                      type: string
                      minLength: 1
                      maxLength: 128
                    payload:
                      type: object
                      required:
                      - key
                      - result
                      properties:
                        key:
                          type: string
                        result:
                          type: string
                          enum:
                          - Success
                          - Error
                        error:
                          oneOf:
                          - type: object
                            additionalProperties:
                              example: {}
                          - type: string
                        ip:
                          type: string
                        userAgent:
                          type: string
                        userAgentParsed:
                          type: object
                          properties:
                            ua:
                              type: string
                            browser:
                              type: object
                              properties:
                                name:
                                  type: string
                                version:
                                  type: string
                                major:
                                  type: string
                                type:
                                  type: string
                            device:
                              type: object
                              properties:
                                model:
                                  type: string
                                type:
                                  type: string
                                vendor:
                                  type: string
                            engine:
                              type: object
                              properties:
                                name:
                                  type: string
                                version:
                                  type: string
                            os:
                              type: object
                              properties:
                                name:
                                  type: string
                                version:
                                  type: string
                            cpu:
                              type: object
                              properties:
                                architecture:
                                  type: string
                        userId:
                          type: string
                        applicationId:
                          type: string
                        sessionId:
                          type: string
                        params:
                          type: object
                          additionalProperties:
                            example: {}
                    createdAt:
                      type: number
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      summary: Get recent logs for a hook
      description: Get recent logs that match the given query for the specified hook with pagination.
  /api/hooks/{id}/test:
    post:
      operationId: CreateHookTest
      tags:
      - Hooks
      parameters:
      - $ref: '#/components/parameters/hookId-root'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - events
              - config
              properties:
                events:
                  type: array
                  items:
                    type: string
                    enum:
                    - PostRegister
                    - PostSignIn
                    - PostSignInAdaptiveMfaTriggered
                    - PostResetPassword
                    - User.Created
                    - User.Deleted
                    - User.Data.Updated
                    - User.SuspensionStatus.Updated
                    - Role.Created
                    - Role.Deleted
                    - Role.Data.Updated
                    - Role.Scopes.Updated
                    - Scope.Created
                    - Scope.Deleted
                    - Scope.Data.Updated
                    - Organization.Created
                    - Organization.Deleted
                    - Organization.Data.Updated
                    - Organization.Membership.Updated
                    - OrganizationRole.Created
                    - OrganizationRole.Deleted
                    - OrganizationRole.Data.Updated
                    - OrganizationRole.Scopes.Updated
                    - OrganizationScope.Created
                    - OrganizationScope.Deleted
                    - OrganizationScope.Data.Updated
                    - Identifier.Lockout
                  description: An array of hook events for testing.
                config:
                  type: object
                  required:
                  - url
                  properties:
                    url:
                      type: string
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                    retries:
                      type: number
                      deprecated: true
                      description: Now the retry times is fixed to 3. Keep for backward compatibility.
                  description: The hook configuration for testing.
                event:
                  deprecated: true
                  description: Use `events` instead.
      responses:
        '204':
          description: The hook test was successful.
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: Unprocessable Content
      summary: Test hook
      description: Test the specified hook with the given events and config.
