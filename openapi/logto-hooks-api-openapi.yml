openapi: 3.0.1
info:
  title: Logto API references Account center Hooks API
  description: 'API references for Logto services.


    Note: The documentation is for Logto Cloud. If you are using Logto OSS, please refer to the response of `/api/swagger.json` endpoint on your Logto instance.'
  version: Cloud
servers:
- url: https://[tenant_id].logto.app/
  description: Logto endpoint address.
security:
- OAuth2:
  - all
tags:
- name: Hooks
  description: Hook enables you to effortlessly receive real-time updates regarding specific events, such as user registration, sign-in, or password reset. See [🪝 Webhooks] to get started and learn more.
paths:
  /api/hooks:
    get:
      operationId: ListHooks
      tags:
      - Hooks
      parameters:
      - name: includeExecutionStats
        in: query
        required: false
        schema:
          type: string
        description: Whether to include execution stats in the response.
      - name: page
        in: query
        description: Page number (starts from 1).
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        description: Entries per page.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
      responses:
        '200':
          description: A list of hooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - tenantId
                  - id
                  - name
                  - event
                  - events
                  - config
                  - signingKey
                  - enabled
                  - createdAt
                  properties:
                    tenantId:
                      type: string
                      maxLength: 21
                    id:
                      type: string
                      minLength: 1
                      maxLength: 21
                    name:
                      type: string
                      maxLength: 256
                    event:
                      type: string
                      enum:
                      - PostRegister
                      - PostSignIn
                      - PostSignInAdaptiveMfaTriggered
                      - PostResetPassword
                      - User.Created
                      - User.Deleted
                      - User.Data.Updated
                      - User.SuspensionStatus.Updated
                      - Role.Created
                      - Role.Deleted
                      - Role.Data.Updated
                      - Role.Scopes.Updated
                      - Scope.Created
                      - Scope.Deleted
                      - Scope.Data.Updated
                      - Organization.Created
                      - Organization.Deleted
                      - Organization.Data.Updated
                      - Organization.Membership.Updated
                      - OrganizationRole.Created
                      - OrganizationRole.Deleted
                      - OrganizationRole.Data.Updated
                      - OrganizationRole.Scopes.Updated
                      - OrganizationScope.Created
                      - OrganizationScope.Deleted
                      - OrganizationScope.Data.Updated
                      - Identifier.Lockout
                      nullable: true
                    events:
                      type: array
                      items:
                        type: string
                        enum:
                        - PostRegister
                        - PostSignIn
                        - PostSignInAdaptiveMfaTriggered
                        - PostResetPassword
                        - User.Created
                        - User.Deleted
                        - User.Data.Updated
                        - User.SuspensionStatus.Updated
                        - Role.Created
                        - Role.Deleted
                        - Role.Data.Updated
                        - Role.Scopes.Updated
                        - Scope.Created
                        - Scope.Deleted
                        - Scope.Data.Updated
                        - Organization.Created
                        - Organization.Deleted
                        - Organization.Data.Updated
                        - Organization.Membership.Updated
                        - OrganizationRole.Created
                        - OrganizationRole.Deleted
                        - OrganizationRole.Data.Updated
                        - OrganizationRole.Scopes.Updated
                        - OrganizationScope.Created
                        - OrganizationScope.Deleted
                        - OrganizationScope.Data.Updated
                        - Identifier.Lockout
                    config:
                      type: object
                      required:
                      - url
                      properties:
                        url:
                          type: string
                        headers:
                          type: object
                          additionalProperties:
                            type: string
                        retries:
                          type: number
                    signingKey:
                      type: string
                      maxLength: 64
                    enabled:
                      type: boolean
                    createdAt:
                      type: number
                    executionStats:
                      type: object
                      required:
                      - successCount
                      - requestCount
                      properties:
                        successCount:
                          type: number
                        requestCount:
                          type: number
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      summary: Get hooks
      description: Get a list of hooks with optional pagination.
    post:
      operationId: CreateHook
      tags:
      - Hooks
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - config
              properties:
                tenantId:
                  type: string
                  maxLength: 21
                name:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: The name of the hook.
                event:
                  type: string
                  enum:
                  - PostRegister
                  - PostSignIn
                  - PostSignInAdaptiveMfaTriggered
                  - PostResetPassword
                  - User.Created
                  - User.Deleted
                  - User.Data.Updated
                  - User.SuspensionStatus.Updated
                  - Role.Created
                  - Role.Deleted
                  - Role.Data.Updated
                  - Role.Scopes.Updated
                  - Scope.Created
                  - Scope.Deleted
                  - Scope.Data.Updated
                  - Organization.Created
                  - Organization.Deleted
                  - Organization.Data.Updated
                  - Organization.Membership.Updated
                  - OrganizationRole.Created
                  - OrganizationRole.Deleted
                  - OrganizationRole.Data.Updated
                  - OrganizationRole.Scopes.Updated
                  - OrganizationScope.Created
                  - OrganizationScope.Deleted
                  - OrganizationScope.Data.Updated
                  - Identifier.Lockout
                  deprecated: true
                  description: Use `events` instead.
                events:
                  type: array
                  items:
                    type: string
                    enum:
                    - PostRegister
                    - PostSignIn
                    - PostSignInAdaptiveMfaTriggered
                    - PostResetPassword
                    - User.Created
                    - User.Deleted
                    - User.Data.Updated
                    - User.SuspensionStatus.Updated
                    - Role.Created
                    - Role.Deleted
                    - Role.Data.Updated
                    - Role.Scopes.Updated
                    - Scope.Created
                    - Scope.Deleted
                    - Scope.Data.Updated
                    - Organization.Created
                    - Organization.Deleted
                    - Organization.Data.Updated
                    - Organization.Membership.Updated
                    - OrganizationRole.Created
                    - OrganizationRole.Deleted
                    - OrganizationRole.Data.Updated
                    - OrganizationRole.Scopes.Updated
                    - OrganizationScope.Created
                    - OrganizationScope.Deleted
                    - OrganizationScope.Data.Updated
                    - Identifier.Lockout
                  description: An array of hook events.
                config:
                  type: object
                  required:
                  - url
                  properties:
                    url:
                      type: string
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                    retries:
                      type: number
                      deprecated: true
                      description: Now the retry times is fixed to 3. Keep for backward compatibility.
                enabled:
                  type: boolean
                createdAt:
                  type: number
      responses:
        '201':
          description: The hook was created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - tenantId
                - id
                - name
                - event
                - events
                - config
                - signingKey
                - enabled
                - createdAt
                properties:
                  tenantId:
                    type: string
                    maxLength: 21
                  id:
                    type: string
                    minLength: 1
                    maxLength: 21
                  name:
                    type: string
                    maxLength: 256
                  event:
                    type: string
                    enum:
                    - PostRegister
                    - PostSignIn
                    - PostSignInAdaptiveMfaTriggered
                    - PostResetPassword
                    - User.Created
                    - User.Deleted
                    - User.Data.Updated
                    - User.SuspensionStatus.Updated
                    - Role.Created
                    - Role.Deleted
                    - Role.Data.Updated
                    - Role.Scopes.Updated
                    - Scope.Created
                    - Scope.Deleted
                    - Scope.Data.Updated
                    - Organization.Created
                    - Organization.Deleted
                    - Organization.Data.Updated
                    - Organization.Membership.Updated
                    - OrganizationRole.Created
                    - OrganizationRole.Deleted
                    - OrganizationRole.Data.Updated
                    - OrganizationRole.Scopes.Updated
                    - OrganizationScope.Created
                    - OrganizationScope.Deleted
                    - OrganizationScope.Data.Updated
                    - Identifier.Lockout
                    nullable: true
                  events:
                    type: array
                    items:
                      type: string
                      enum:
                      - PostRegister
                      - PostSignIn
                      - PostSignInAdaptiveMfaTriggered
                      - PostResetPassword
                      - User.Created
                      - User.Deleted
                      - User.Data.Updated
                      - User.SuspensionStatus.Updated
                      - Role.Created
                      - Role.Deleted
                      - Role.Data.Updated
                      - Role.Scopes.Updated
                      - Scope.Created
                      - Scope.Deleted
                      - Scope.Data.Updated
                      - Organization.Created
                      - Organization.Deleted
                      - Organization.Data.Updated
                      - Organization.Membership.Updated
                      - OrganizationRole.Created
                      - OrganizationRole.Deleted
                      - OrganizationRole.Data.Updated
                      - OrganizationRole.Scopes.Updated
                      - OrganizationScope.Created
                      - OrganizationScope.Deleted
                      - OrganizationScope.Data.Updated
                      - Identifier.Lockout
                  config:
                    type: object
                    required:
                    - url
                    properties:
                      url:
                        type: string
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                      retries:
                        type: number
                  signingKey:
                    type: string
                    maxLength: 64
                  enabled:
                    type: boolean
                  createdAt:
                    type: number
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      summary: Create a hook
      description: Create a new hook with the given data.
  /api/hooks/{id}:
