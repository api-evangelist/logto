                    nullable: true
                  events:
                    type: array
                    items:
                      type: string
                      enum:
                      - PostRegister
                      - PostSignIn
                      - PostSignInAdaptiveMfaTriggered
                      - PostResetPassword
                      - User.Created
                      - User.Deleted
                      - User.Data.Updated
                      - User.SuspensionStatus.Updated
                      - Role.Created
                      - Role.Deleted
                      - Role.Data.Updated
                      - Role.Scopes.Updated
                      - Scope.Created
                      - Scope.Deleted
                      - Scope.Data.Updated
                      - Organization.Created
