      operationId: UpdateAccountCenterSettings
      tags:
      - Account center
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: Enable or disable the account API.
                fields:
                  type: object
                  properties:
                    name:
                      type: string
                      enum:
                      - 'Off'
                      - ReadOnly
                      - Edit
                    avatar:
                      type: string
                      enum:
                      - 'Off'
                      - ReadOnly
                      - Edit
                    profile:
                      type: string
                      enum:
                      - 'Off'
                      - ReadOnly
                      - Edit
                    email:
                      type: string
