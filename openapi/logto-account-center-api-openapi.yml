                      - ReadOnly
                      - Edit
                    mfa:
                      type: string
                      enum:
                      - 'Off'
                      - ReadOnly
                      - Edit
                    session:
                      type: string
                      enum:
                      - 'Off'
                      - ReadOnly
                      - Edit
