openapi: 3.0.1
info:
  title: Logto API references Account center API
  description: 'API references for Logto services.


    Note: The documentation is for Logto Cloud. If you are using Logto OSS, please refer to the response of `/api/swagger.json` endpoint on your Logto instance.'
  version: Cloud
servers:
- url: https://[tenant_id].logto.app/
  description: Logto endpoint address.
security:
- OAuth2:
  - all
tags:
- name: Account center
  description: Customize your account API settings.
paths:
  /api/account-center:
    get:
      operationId: GetAccountCenterSettings
      tags:
      - Account center
      parameters: []
      responses:
        '200':
          description: Account center settings.
          content:
            application/json:
              schema:
                type: object
                required:
                - tenantId
                - id
                - enabled
                - fields
                - webauthnRelatedOrigins
                - deleteAccountUrl
                - customCss
                properties:
                  tenantId:
                    type: string
                    maxLength: 21
                  id:
                    type: string
                    minLength: 1
                    maxLength: 21
                  enabled:
                    type: boolean
                  fields:
                    type: object
                    properties:
                      name:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      avatar:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      profile:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      email:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      phone:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      password:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      username:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      social:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      customData:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      mfa:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                      session:
                        type: string
                        enum:
                        - 'Off'
                        - ReadOnly
                        - Edit
                  webauthnRelatedOrigins:
                    type: array
                    items:
                      type: string
                  deleteAccountUrl:
                    type: string
                    maxLength: 2048
                    nullable: true
                  customCss:
                    type: string
                    nullable: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      summary: Get account center settings
      description: Get the account center settings.
