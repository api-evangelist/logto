                          maxLength: 256
                        minLength:
                          type: number
                        maxLength:
                          type: number
                        minValue:
                          type: number
                        maxValue:
                          type: number
                        format:
                          type: string
                          maxLength: 128
                        customFormat:
                          type: string
                          maxLength: 128
                        options:
                          type: array
                          items:
