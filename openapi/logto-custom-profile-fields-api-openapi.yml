                            required:
                            - value
                            properties:
                              label:
                                type: string
                              value:
                                type: string
                        defaultValue:
                          type: string
                        parts:
                          type: array
                          items:
                            type: object
                            required:
                            - enabled
                            - name
                            - type
                            - required
                            properties:
                              enabled:
                                type: boolean
                              name:
                                type: string
                              type:
                                type: string
                                enum:
                                - Text
                                - Number
                                - Date
                                - Checkbox
                                - Select
                                - Url
                                - Regex
                                - Address
                                - Fullname
                              label:
