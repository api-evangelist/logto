openapi: 3.0.1
info:
  title: Logto API references Account center Custom phrases API
  description: 'API references for Logto services.


    Note: The documentation is for Logto Cloud. If you are using Logto OSS, please refer to the response of `/api/swagger.json` endpoint on your Logto instance.'
  version: Cloud
servers:
- url: https://[tenant_id].logto.app/
  description: Logto endpoint address.
security:
- OAuth2:
  - all
tags:
- name: Custom phrases
  description: 'Endpoints for managing custom phrases that allow you to customize the phrases displayed in the sign-in experience.


    See [Localized language](https://docs.logto.io/docs/recipes/customize-sie/localized-language/) to learn more about custom phrases for localization.'
paths:
  /api/custom-phrases:
    get:
      operationId: ListCustomPhrases
      tags:
      - Custom phrases
      parameters: []
      responses:
        '200':
          description: An array of custom phrases.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - tenantId
                  - id
                  - languageTag
                  - translation
                  properties:
                    tenantId:
                      type: string
                      maxLength: 21
                    id:
                      type: string
                      minLength: 1
                      maxLength: 21
                    languageTag:
                      type: string
                      minLength: 1
                      maxLength: 16
                    translation:
                      $ref: '#/components/schemas/TranslationObject'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      summary: Get all custom phrases
      description: Get all custom phrases for all languages.
