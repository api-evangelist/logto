- aid: logto:logto-applications-api
  name: Logto Applications API
  description: >-
    Application represents your registered software program or service that has been authorized to access
    user information and perform actions on behalf of users within the system. Currently, Logto supports
    four types of applications:


    - Traditional web


    - Single-page app

    - Native app

    - Machine-to-machine app.


    Depending on the application type, it may have different authentication flows and access to the system.
    See [🔗 Integrate Logto in your application](https://docs.logto.io/docs/recipes/integrate-logto/) to
    learn more about how to integrate Logto into your application.


    Role-based access control (RBAC) is supported for machine-to-machine applications. See [🔐 Role-based
    access control (RBAC)](https://docs.logto.io/docs/recipes/rbac/) to get started with role-based access
    control.
  humanURL: https://docs.logto.io
  tags:
